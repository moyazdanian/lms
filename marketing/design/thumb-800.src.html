<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMS — 800×400</title>
<style>{{FONTS_CSS}}</style>
<style>{{DESIGN_CSS}}</style>
</head>
<body>
<div class="asset thumb thumb-800">
  <div class="grid"></div>
  <div class="ring ring-a"></div>
  <div class="ring ring-b"></div>

  <div class="copy">
    <div class="logo">{{LOGO}}</div>

    <div class="eyebrow">
      <span class="eyebrow-dot"></span>
      Self-hosted · Laravel 12 + Next.js 15
    </div>

    <h1 class="headline">Your academy.<br>Your <span class="serif">rules.</span></h1>

    <p class="sub">
      The complete learning platform — storefront, instructor marketplace,
      payments, quizzes and certificates.
    </p>

    <div class="chips">
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-5 4 5 4"/><path d="m16 8 5 4-5 4"/><path d="m14 4-4 16"/></svg>
        Laravel + Next.js
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h3"/></svg>
        4 gateways
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="3"/><path d="m16 10 6-3v10l-6-3z"/></svg>
        S3 video
      </div>
    </div>

    <div class="note">
      <span class="note-check">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
      </span>
      One-time purchase. No monthly fees.
    </div>
  </div>

  <div class="stage">
    <div class="stage-glow"></div>
    {{BROWSER}}
    {{COURSE}}
    {{TOAST}}
  </div>
</div>
</body>
</html>
