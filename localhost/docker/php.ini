; PHP defaults (2M upload / 8M post) are far below what the app accepts:
; a course preview video may be up to 500 MB and lesson attachments can be
; larger still, while nginx already allows 1 GB per request. When a request
; exceeded post_max_size PHP dropped $_POST/$_FILES and Laravel answered with
; a bare "The POST data is too large." response (200, no CORS headers), which
; the browser reported as a CORS error on the instructor course form.
upload_max_filesize = 1024M
post_max_size = 1024M
memory_limit = 512M

; Long uploads and the proxy-mode video streaming route must not be cut off
; earlier than nginx's fastcgi_read_timeout (600s).
max_execution_time = 600
max_input_time = 600

; JSON/API responses must never be prefixed with PHP warnings.
display_errors = Off
log_errors = On
