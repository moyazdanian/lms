server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Course videos and lesson attachments are uploaded through the API.
    client_max_body_size 1024m;

    # In proxy mode (VIDEO_SERVING_MODE=proxy) Laravel streams private videos,
    # so the connection must stay open and nginx must not buffer the body.
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 600s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_buffering off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Public disk (thumbnails, logos) is a symlink created by the entrypoint.
    location /storage/ {
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
