; Keeps nginx, php-fpm and the queue worker in one container, all logging to
; the Docker output.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queued work: notification mail, enrollment confirmations, payout and course
; approval messages. Without this program they would sit in the `jobs` table
; forever, because QUEUE_CONNECTION=database.
;
; --max-time makes the worker exit on its own after an hour and supervisord
; starts a fresh one, so memory used by long-lived workers is released.
; --tries caps retries of a failing job; after that it moves to failed_jobs.
[program:queue-worker]
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --verbose
directory=/var/www/html
; www-data owns storage/, so files and logs written by the worker match php-fpm.
user=www-data
autorestart=true
startsecs=5
; Send the stop signal to the worker's whole process group, and give it time to
; finish the job in hand instead of killing it halfway.
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
